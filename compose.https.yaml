# Enable after setting SHADOW_DOMAIN and pointing DNS to this server.
services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SHADOW_DOMAIN: ${SHADOW_DOMAIN:?Set SHADOW_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
