name: CI and deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing DEPLOY_SSH_KEY
        type: environment
        required: true
        default: production

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest
        working-directory: backend
      - run: bash -n deploy/run.sh

  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: shadow-app:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export deployment image
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker image save "shadow-app:ci-$RELEASE_SHA" --output "$RUNNER_TEMP/image.tar"
          test "$(stat -c %s "$RUNNER_TEMP/image.tar")" -le 1073741824
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-image-${{ github.sha }}
          path: ${{ runner.temp }}/image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: https://fourward.thangqt.com
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-image-${{ github.sha }}
          path: ${{ runner.temp }}/deployment
      - name: Deploy through restricted SSH command
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST || 'fourward.thangqt.com' }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" || { echo 'Set DEPLOY_SSH_KEY in the selected GitHub environment.' >&2; exit 1; }
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/deploy-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          unset DEPLOY_SSH_KEY
          printf '%s\n' 'fourward-production ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJwEEfrDj8PVK2rwGwEciTtggqEdFfiqvum31X0Hfs1h' > "$ssh_dir/known_hosts"
          ssh_options=(
            -T -i "$ssh_dir/key"
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o HostKeyAlias=fourward-production -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4
          )
          ssh "${ssh_options[@]}" "shadowdeploy@$DEPLOY_HOST" "deploy $RELEASE_SHA" < "$RUNNER_TEMP/deployment/image.tar"
          ssh "${ssh_options[@]}" "shadowdeploy@$DEPLOY_HOST" status
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 15 \
            https://fourward.thangqt.com/api/health
